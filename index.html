<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ann's Shelf</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #15110e; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; touch-action: none; }
      #label {
        position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 8px);
        padding: 10px 18px; border-radius: 999px;
        background: rgba(20, 16, 12, 0.72); backdrop-filter: blur(8px);
        color: #f3e9dc; font: 600 18px/1.2 'Pixelify Sans', monospace; letter-spacing: 0.04em;
        -webkit-font-smoothing: none; font-smooth: never;
        opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
      }
      #label.visible { opacity: 1; transform: translate(-50%, 0); }
      #label small { font-weight: 400; font-size: 16px; opacity: 0.6; margin-left: 10px; }
      #label em { font-style: normal; font-weight: 400; font-size: 16px; margin-left: 12px; color: #f2c14e; }
      #sound {
        position: fixed; right: 20px; bottom: 32px;
        padding: 8px 14px; border: 1px solid rgba(243, 233, 220, 0.25); border-radius: 999px;
        background: rgba(20, 16, 12, 0.72); color: #f3e9dc; cursor: pointer;
        font: 400 16px/1.2 'Pixelify Sans', monospace; letter-spacing: 0.04em;
        -webkit-font-smoothing: none;
      }
      #sound:hover { border-color: rgba(243, 233, 220, 0.6); }
      #sound.on { color: #f2c14e; border-color: rgba(242, 193, 78, 0.6); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="label"></div>
    <button id="sound" class="on" type="button">♪ Sound on</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
